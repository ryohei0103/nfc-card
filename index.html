<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC電子名刺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-header">
  <div class="brand">📇 NFC電子名刺</div>
</div>

<div class="card" style="text-align:center;">
  <h1 style="font-size:20px;">タップで繋がる、あなたの名刺</h1>
  <p style="color:var(--text-dim); font-size:14px; line-height:1.7;">
    プロフィールをオンラインで管理し、NFCカードにかざすだけで<br>公開ページに案内できます。壁紙で自分らしくデコレーション。
  </p>
</div>

<div class="tabs">
  <button id="tab-login" class="active">ログイン</button>
  <button id="tab-signup">新規登録</button>
</div>

<div class="card">
  <form id="auth-form">
    <div class="field">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6">
    </div>
    <button type="submit" class="btn btn-block" id="submit-btn">ログイン</button>
    <div class="msg" id="auth-msg"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
</body>
</html>
