<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRコード - NFC電子名刺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-header">
  <div class="brand">📇 QRコード</div>
  <a class="btn ghost small" href="dashboard.html">マイページに戻る</a>
</div>

<div class="tabs">
  <button id="tab-btn-share" type="button">QRコードで共有</button>
  <button id="tab-btn-scan" type="button">QRコードを読み取る</button>
</div>

<!-- QRコードで共有 -->
<div id="tab-share">
  <div class="card">
    <p style="font-size:13px; color:var(--text-dim); line-height:1.7;">
      相手にカメラで読み取ってもらうと、あなたの公開ページが開きます。iPhoneなどNFC非対応の端末でも使えます。
    </p>
    <div id="qr-wrap" style="display:flex; justify-content:center; padding:12px 0;"></div>
    <div class="msg" id="qr-msg" style="text-align:center;"></div>
  </div>
</div>

<!-- QRコードを読み取る -->
<div id="tab-scan">
  <div class="card">
    <p style="font-size:13px; color:var(--text-dim); line-height:1.7;">
      相手の名刺のQRコードをカメラで読み取ると、そのまま相手の公開ページに移動します。
    </p>
    <video id="scan-video" playsinline style="width:100%; border-radius:12px; background:#000; display:none;"></video>
    <canvas id="scan-canvas" style="display:none;"></canvas>
    <button type="button" class="btn btn-block" id="scan-start-btn">スキャン開始</button>
    <button type="button" class="btn secondary btn-block" id="scan-stop-btn" style="display:none; margin-top:8px;">スキャン停止</button>
    <div class="msg" id="scan-msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="qr.js"></script>
</body>
</html>
